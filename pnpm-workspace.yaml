catalogMode: strict

cleanupUnusedCatalogs: true

engineStrict: true

fetchTimeout: 240000

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@storm-software/*'
  - '@stryke/*'
  - '@powerlines/*'
  - powerlines
  - '@earthquake/*'
  - earthquake

onlyBuiltDependencies:
  - '@swc/core'
  - aws-crt
  - core-js
  - esbuild
  - gifsicle
  - jpegtran-bin
  - lefthook
  - nx
  - optipng-bin
  - sharp
  - unrs-resolver
  - workerd

overrides:
  '@storm-software/tools-config': workspace:*
  '@storm-software/tools-scripts': workspace:*
  '@storm-software/video-assets': workspace:*
  ip: '>=2.0.1'
  markdown-it: '>=14.3.1'

trustPolicy: off
